name: 每日竞品情报更新

on:
  workflow_dispatch:
  schedule:
    - cron: '30 21 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect-and-validate:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:weekly
      - run: npm run test:collect
      - run: npm run test:platforms
      - name: 复审平台入口可达性
        run: npm run audit:platforms
      - name: 抓取匿名公开来源并执行覆盖率校验
        run: |
          npm run update:intelligence || {
            echo "::warning::首次抓取未达标（可能遇到平台偶发失败），60 秒后自动重试一次"
            sleep 60
            npm run update:intelligence
          }
      - name: 更新抓取时间戳
        run: |
          node -e "const fs=require('fs');const d=new Date(Date.now()+8*3600*1000).toISOString().slice(0,19)+'+08:00';fs.writeFileSync('src/data/crawl_stamp.json', JSON.stringify({lastCrawl:d})+String.fromCharCode(10))"
      - name: 提交台账、抓取报告与时间戳
        run: |
          git config user.name "pixel-intelligence-bot"
          git config user.email "pixel-intelligence-bot@users.noreply.github.com"
          git add src/data/intelligence.flat.json src/data/intelligence.json src/data/pending-review.json src/data/wechat-leads.json src/data/crawl_stamp.json public/data/latest-run.json public/data/scan-state.json public/data/platform-audit.json
          git diff --cached --quiet || git commit -m "data: weekly intelligence update"
          git push
      - name: 构建公开工作台
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
      - id: deployment
        uses: actions/deploy-pages@v4
