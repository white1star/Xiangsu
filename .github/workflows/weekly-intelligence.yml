name: 每周竞品情报更新

on:
  schedule:
    - cron: '10 1 * * 1'
      timezone: Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:weekly
      - name: 抓取匿名公开来源并执行覆盖率校验
        run: npm run update:intelligence
      - name: 提交本周台账与抓取报告
        run: |
          git config user.name "pixel-intelligence-bot"
          git config user.email "pixel-intelligence-bot@users.noreply.github.com"
          git add src/data/intelligence.json public/data/latest-run.json
          git diff --cached --quiet || git commit -m "data: weekly intelligence update"
          git push
